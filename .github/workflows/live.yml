name: Live scores

# Before kickoff (Wed–Sun mornings): one snapshot a few times a day as projections change.
# During NFL game windows: a job takes a live snapshot for every league every 2 minutes while games are on, and
# before it ends starts the next one if games are still on or coming up (GitHub's own schedule can run hours late). Snapshots go to the `live` branch, overwritten each time, so game days
# add no history to main and don't rebuild the site. The site reads them from raw.githubusercontent.com and keeps
# scores moving in between from ESPN's public box scores.
on:
  schedule:
    - cron: '2 13-23 * 9-12,1 0'   # Sunday (UTC), London games through the late window
    - cron: '2 0-4 * 9-12,1 1'     # Sunday night game
    - cron: '2 0-4 * 9-12,1 2'     # Monday night
    - cron: '2 0-4 * 9-12,1 5'     # Thursday night
    - cron: '2 17-23 * 12,1 6'     # Saturday games late in the season
    - cron: '2 0-4 * 12,1 0'       # Saturday night
    # before kickoff: projections, injuries and win chances refresh a few times a day (one snapshot each)
    - cron: '17 14,19,23 * 9-12,1 3,4,5,6'   # Wed–Sat, about 10am, 3pm and 7pm ET
    - cron: '17 11 * 9-12,1 0'               # Sunday morning, before the London game
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to keep taking snapshots (minutes)'
        default: '330'

permissions:
  contents: write
  actions: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshots
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_DIR: ${{ github.workspace }}/live-out
        run: |
          git clone -q --depth 1 -b live "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-out 2>/dev/null || mkdir -p live-out
          rm -rf live-out/.git
          for cfg in leagues/*.json; do
            slug=$(python3 -c "import json; print(json.load(open('$cfg'))['site']['slug'])")
            python3 pipeline/live.py "$cfg" "live-out/$slug.json" --loop "${{ inputs.minutes || '330' }}" --every 120 --after pipeline/push_live.sh &
          done
          wait

      # GitHub's schedule can run hours late or skip runs on busy Sundays, so while games are on (or about to be) the
      # job starts its own next run. A run started this way (workflow_dispatch) is allowed to trigger another.
      - name: Keep going while games are on
        if: always()
        timeout-minutes: 250
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wait=$(python3 pipeline/live_next.py 7)
          if [ "$wait" = "no" ]; then echo "No games on or coming up; stopping."; exit 0; fi
          if [ "$wait" -gt 0 ]; then echo "Next kickoff is a while off; waiting $((wait / 60)) minutes."; sleep "$wait"; fi
          gh workflow run live.yml -R "$GITHUB_REPOSITORY" -f minutes=330 && echo "Started the next run."
