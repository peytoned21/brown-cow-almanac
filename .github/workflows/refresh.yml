name: Weekly refresh

# Every league in leagues/: pull the current season from ESPN, rebuild, run the stats check, redraw the share cards,
# commit only the leagues whose checks pass. Pages republishes the site. The GroupMe post comes later, with the
# newsletter (see post.yml).
on:
  schedule:
    - cron: '49 13 * 9-12,1 2'   # Tuesdays, Sept–Jan (8:49 ET in winter, 9:49 ET in summer time)
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if ESPN data has not changed'
        type: boolean
        default: false
      post_groupme:
        description: 'Post the recaps to GroupMe'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install -q -r requirements.txt playwright
          python3 -m playwright install --with-deps chromium > /dev/null

      - name: Fetch, build, check
        id: run
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          FORCE: ${{ inputs.force }}
        run: pipeline/refresh.sh

      - name: Commit
        if: always()
        run: |
          if [ ! -s changed_leagues.txt ]; then echo "Nothing to commit."; exit 0; fi
          git config user.name "brown-cow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Weekly refresh: $(python3 -c "import json; d=json.load(open('data.json')); c=d['meta'].get('cur'); print(f\"{c['y']} through week {c['week']}\" if c else 'final')")"
          git pull -q --rebase -X theirs
          git push -q

      - name: Post recaps to GroupMe
        if: always() && inputs.post_groupme   # scheduled posts come from the newsletter (post.yml)
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          AGS_GROUPME_BOT_ID: ${{ secrets.AGS_GROUPME_BOT_ID }}
        run: |
          [ -s changed_leagues.txt ] || exit 0
          while read -r cfg; do python3 pipeline/groupme.py "$cfg" || echo "::warning::GroupMe post failed for $cfg"; done < changed_leagues.txt
