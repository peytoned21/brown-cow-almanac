name: Live scores

# Every 15 minutes during NFL game windows: live scores, projected finals, live win chances and
# live playoff odds, written to live.json. The site polls that file while it is open.
# GitHub may start a scheduled run a few minutes late; that's normal.
on:
  schedule:
    - cron: '*/15 13-23 * 9-12,1 0'   # Sunday, London games through the late window (UTC)
    - cron: '*/15 0-4 * 9-12,1 1'     # Sunday night game
    - cron: '*/15 0-4 * 9-12,1 2'     # Monday night
    - cron: '*/15 0-4 * 9-12,1 5'     # Thursday night
    - cron: '*/15 17-23 * 12,1 6'     # Saturday games late in the season
    - cron: '*/15 0-4 * 12,1 0'       # Saturday night
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull live scores
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python3 pipeline/live.py data.json live.json

      - name: Publish
        run: |
          if [ -z "$(git status --porcelain live.json)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "brown-cow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "Live: week $(python3 -c "import json; print(json.load(open('live.json'))['wk'])") $(date -u +%H:%M) UTC"
          git pull -q --rebase && git push -q
